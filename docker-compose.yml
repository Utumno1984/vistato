# Postgres for local development and tests (app runs with `npm run dev`).
services:
  db:
    image: postgres:17-alpine
    container_name: vistato-db
    environment:
      POSTGRES_USER: vistato
      POSTGRES_PASSWORD: vistato
      POSTGRES_DB: vistato
    ports:
      - "5433:5432" # 5433 avoids clashing with a Postgres already on the host
    volumes:
      - vistato-db:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistato"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  vistato-db:
