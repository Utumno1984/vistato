name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step (e.g. an interactive `drizzle-kit generate` prompt) must not block CI.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vistato
          POSTGRES_PASSWORD: vistato
          POSTGRES_DB: vistato_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vistato" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vistato:vistato@localhost:5432/vistato_test
      TEST_DATABASE_URL: postgres://vistato:vistato@localhost:5432/vistato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check that migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema/ has changes not generated in drizzle/: run 'npm run db:generate' and commit the migration."
            git status --porcelain drizzle/
            exit 1
          fi
      - run: npm run db:migrate:test
      - run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
