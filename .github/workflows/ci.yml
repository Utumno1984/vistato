name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step (e.g. an interactive `drizzle-kit generate` prompt) must not block CI.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vistato
          POSTGRES_PASSWORD: vistato
          POSTGRES_DB: vistato_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vistato" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://vistato:vistato@localhost:5432/vistato_test
      TEST_DATABASE_URL: postgres://vistato:vistato@localhost:5432/vistato_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check that migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            echo "::error::src/db/schema/ has changes not generated in drizzle/: run 'npm run db:generate' and commit the migration."
            git status --porcelain drizzle/
            exit 1
          fi
      - run: npm run db:migrate:test
      - run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Fails when a vitest/Playwright test disappears or is renamed compared to the PR base, unless
  # the PR has the label `rimozione-funzionalita` and a valid "## Rimozione funzionalità" section.
  # No secrets and only the plain pull_request event: this job executes code of the PR. Labels and
  # body are read at run time (a re-run after adding the label sees it) and passed as files.
  test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip on push
        if: github.event_name != 'pull_request'
        run: 'echo "guardia saltata: già applicata sulla PR"'
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
      - name: Compare tests with the PR base
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "$RUNNER_TEMP/test-guard-XXXXXX")"
          cleanup() {
            git worktree remove --force "$tmp/base" 2>/dev/null || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          # Labels and body now, not from the (possibly stale) event payload.
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels' > "$tmp/labels.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$tmp/body.md"

          # The merge-base stays correct for stacked PRs and when the base moves on.
          merge_base="$(git merge-base "$BASE_SHA" HEAD)"
          git worktree add --detach "$tmp/base" "$merge_base"
          if git diff --quiet "$merge_base" HEAD -- package-lock.json; then
            ln -s "$GITHUB_WORKSPACE/node_modules" "$tmp/base/node_modules"
          else
            (cd "$tmp/base" && npm ci)
          fi

          # Always the script of HEAD: the base may not contain it. Exit 2 on empty/failed list.
          node_modules/.bin/tsx "$GITHUB_WORKSPACE/scripts/list-tests.ts" --root "$tmp/base" > "$tmp/base.json"
          node_modules/.bin/tsx "$GITHUB_WORKSPACE/scripts/list-tests.ts" --root "$GITHUB_WORKSPACE" > "$tmp/head.json"

          node_modules/.bin/tsx "$GITHUB_WORKSPACE/scripts/check-test-removal.ts" \
            --base "$tmp/base.json" --head "$tmp/head.json" \
            --labels-file "$tmp/labels.json" --body-file "$tmp/body.md"
